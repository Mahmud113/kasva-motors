{% load static %}<!doctype html>
<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Kasva Motors{% endblock %}</title><link rel="stylesheet" href="{% static 'shop/styles.css' %}"></head>
<body><header><div class="header-inner"><a class="brand" href="{% url 'shop:product_list' %}"><span>KM</span> Kasva Motors</a><form class="search" action="{% url 'shop:product_list' %}"><input name="q" value="{{ request.GET.q }}" placeholder="Hissə adı və ya nömrəsi ilə axtarın"><button>Axtarış</button></form><nav><a href="{% url 'shop:contact' %}">Bizimlə Əlaqə</a><a class="cart-link" href="{% url 'shop:cart_detail' %}">Səbət <b>{{ cart_count }}</b></a></nav></div></header>
{% if messages %}<div class="messages">{% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}</div>{% endif %}
<main>{% block content %}{% endblock %}</main><footer><strong>Kasva Motors</strong><span>Avtomobiliniz üçün doğru hissələr</span><a href="tel:+994502054848">050 205 48 48</a></footer></body></html>
